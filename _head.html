<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUUQ — Digitale Produkte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Almarai:wght@400;700;800&family=Alexandria:wght@300;400;500&family=Syne:wght@600;700;800&family=Unbounded:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Roboto+Flex:wght@300;400&family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Good Vibes Pro';src:url('assets/GoodVibes.ttf') format('truetype');font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#f7f6f6;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  #scaleWrap{width:100%;overflow-x:hidden}
  #scaler{width:1440px;transform-origin:top left;position:relative;background:#f7f6f6}
  #stage{position:relative;width:1440px;height:6320px;background:#f7f6f6;overflow:hidden}
  .t{pointer-events:auto}
  .tilt-img{will-change:transform;transform-style:preserve-3d;transition:transform .5s ease}
  .chime-img{will-change:transform;transform-origin:50% 0%;cursor:pointer}
  /* sticky menu + spinning logo */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(247,246,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.07);transform:translateY(-100%);transition:transform .35s ease}
  #topbar.show{transform:none}
  #topbar .tb-in{max-width:1440px;margin:0 auto;height:60px;display:flex;align-items:center;padding:0 26px}
  #topbar .tb-logo{display:flex;align-items:center;gap:10px}
  #topbar .tb-logo img{width:26px;height:26px;display:block}
  #topbar .tb-logo b{font-family:'Almarai',sans-serif;font-weight:800;font-size:20px;color:#0f0f0f}
  #topbar .tb-nav{display:flex;gap:26px;margin-left:40px}
  #topbar .tb-nav a{font-size:14px;color:#0f0f0f;text-decoration:none;cursor:pointer;transition:color .2s}
  #topbar .tb-nav a:hover{color:#388afe}
  #topbar .tb-cta{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#0f0f0f;color:#fff;font-size:14px;padding:9px 18px;border-radius:22px;text-decoration:none}
  #topbar .tb-cta:hover{box-shadow:0 6px 18px rgba(56,138,254,.45)}
  @media(max-width:820px){#topbar .tb-nav{display:none}}
  .guide-full{position:absolute;top:0;width:1px;background:rgba(70,90,130,.10);pointer-events:none;z-index:120}
  .gicon{position:absolute;z-index:3}
</style>
</head>
<body>
<div id="scaleWrap"><div id="scaler">
<div id="stage">
