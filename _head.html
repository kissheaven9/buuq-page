<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#f7f6f6;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  #scaleWrap{width:100%;overflow-x:hidden}
  #scaler{width:1440px;transform-origin:top left;position:relative;background:#f7f6f6}
  #stage{position:relative;width:1440px;height:2456px;background:#f7f6f6;overflow:hidden}
  #stage .t{pointer-events:auto}
  /* H1 interactive */
  #n31_634{cursor:default;user-select:none}
  #n31_634 .ch{transition:color .18s ease}
  #n31_634 .script{font-family:'Dancing Script',cursive;font-weight:700;font-style:normal}
  /* hero visual */
  #n36_5{transition:transform .25s cubic-bezier(.2,.8,.2,1);will-change:transform}
  /* tilt / wind images */
  .tilt-img{will-change:transform;transform-style:preserve-3d}
  /* ===== new blocks ===== */
  .sec{position:relative;width:1440px;background:#f7f6f6;padding:0 116px}
  /* Lösungen: sticky intro + scrolling cards */
  .loes{padding-top:60px;padding-bottom:70px}
  .loes-grid{display:flex;gap:56px;align-items:flex-start}
  .loes-intro{width:320px;flex:none;position:sticky;top:40px}
  .loes-intro h2{font:700 34px/1.12 'Inter',sans-serif;letter-spacing:-.02em;color:#0f0f0f}
  .loes-intro p{margin-top:18px;font-size:15px;line-height:1.55;color:#6a6a6a}
  .loes-intro a{display:inline-flex;gap:8px;margin-top:24px;font-size:15px;color:#0f0f0f;text-decoration:none;font-weight:500}
  .loes-cards{flex:1;display:flex;flex-direction:column;gap:20px}
  .loes-card{display:flex;gap:32px;background:transparent;padding:30px 26px;transition:background .3s}
  .loes-card:hover{background:rgba(0,0,0,.02)}
  .loes-card .lc-body{flex:1}
  .loes-card .num{font-size:15px;color:#b3b3b3;font-weight:500}
  .loes-card .lc-img{width:280px;height:190px;object-fit:cover;border-radius:12px;flex:none;align-self:center}
  .loes-card h3{font:600 26px/1.1 'Inter',sans-serif;color:#0f0f0f;margin-top:6px}
  .loes-card .desc{color:#6a6a6a;font-size:14.5px;line-height:1.5;margin-top:8px}
  .loes-card .feats{display:flex;gap:28px;margin-top:16px}
  .loes-card .feats ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .loes-card .feats li{font-size:13.5px;color:#3a3a3a}
  .loes-card .price-row{display:flex;align-items:baseline;gap:12px;margin-top:18px;border-top:1px solid #efefef;padding-top:16px}
  .loes-card .price{font:600 26px 'Inter',sans-serif;color:#0f0f0f}
  .loes-card .pnote{font-size:13px;color:#9a9a9a}
  @media(max-width:1000px){.loes-grid{flex-direction:column}.loes-intro{position:static;width:auto}.loes-card{grid-template-columns:1fr}.loes-card .lc-img{width:100%}}
  .eyebrow{font-family:'Alexandria','Inter',sans-serif;font-size:13px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:#a5a5a6;display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:34px;height:1px;background:#c9c9cb;display:inline-block}
  .sec h2{font-family:'Inter',sans-serif;font-size:40px;font-weight:700;letter-spacing:-.02em;color:#0f0f0f;line-height:1.05}
  /* corner brackets — «инженерный чертёж» */
  .brk{position:relative}
  .brkc{position:absolute;width:15px;height:15px;border:1.5px solid #23262c;pointer-events:none}
  .brkc.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .brkc.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
  .brkc.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
  .brkc.br{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .pill{position:relative;display:inline-flex;align-items:center;gap:10px;background:#0f0f0f;color:#fff;font-size:15px;padding:12px 22px;border-radius:24px;border:none;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .2s,background .2s}
  .pill::after{content:"→";color:#fff;transition:transform .2s}
  .pill:hover{transform:translateY(-2px);background:#000;box-shadow:0 8px 22px rgba(56,138,254,.45),0 0 0 1px rgba(56,138,254,.6) inset}
  .pill:hover::after{transform:translateX(4px)}
  /* reviews */
  .rev-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
  .rev{background:#fafafa;border:1px solid #ececec;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px;transition:transform .3s,box-shadow .3s}
  .rev:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.08)}
  .rev .stars{color:#388afe;font-size:15px;letter-spacing:2px}
  .rev p{font-size:16px;line-height:1.6;color:#2b2b2b}
  .rev .who{display:flex;align-items:center;gap:12px;margin-top:auto}
  .rev .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#388afe,#7db0ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .rev .nm{font-weight:600;font-size:15px;color:#0f0f0f}
  .rev .rl{font-size:13px;color:#8a8a8a}
  /* chat */
  .chat-sec{background:#0b0d12;color:#fff;padding-top:96px;padding-bottom:110px}
  .chat-sec .eyebrow{color:#7db0ff}
  .chat-sec .eyebrow::before{background:#7db0ff}
  .chat-sec h2{color:#fff}
  .chat-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-top:48px}
  .chat-copy p{color:#aeb6c6;font-size:18px;line-height:1.65;margin-top:20px;max-width:460px}
  .chat-feats{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .chat-feats div{display:flex;gap:12px;align-items:flex-start;color:#dfe4ee;font-size:15px}
  .chat-feats span{color:#388afe;font-weight:700}
  .chat-win{background:#12151d;border:1px solid #232838;border-radius:20px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .chat-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #232838;background:#151925}
  .chat-head .dot{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#388afe,#7db0ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .chat-head b{font-size:15px}.chat-head small{color:#7ea0c8;font-size:12px;display:block}
  .chat-head .on{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#5fd08a}
  .chat-head .on::before{content:"";width:7px;height:7px;border-radius:50%;background:#5fd08a;box-shadow:0 0 8px #5fd08a}
  .chat-body{padding:22px 20px;display:flex;flex-direction:column;gap:14px;height:360px;overflow:hidden}
  .msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.5;opacity:0;transform:translateY(10px);animation:pop .5s forwards}
  .msg.bot{background:#1c2233;color:#e8edf6;border-bottom-left-radius:4px;align-self:flex-start}
  .msg.usr{background:#388afe;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  @keyframes pop{to{opacity:1;transform:none}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{border:1px solid #2c3446;color:#9fb2cf;font-size:13px;padding:7px 13px;border-radius:20px;background:transparent;cursor:pointer;transition:.2s}
  .chip:hover{border-color:#388afe;color:#fff}
  .typing{display:flex;gap:4px;padding:14px 16px;background:#1c2233;border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;width:56px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#6b7891;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .chat-input{display:flex;gap:10px;padding:16px 20px;border-top:1px solid #232838;background:#151925}
  .chat-input input{flex:1;background:#0e111a;border:1px solid #262c3c;border-radius:22px;padding:12px 18px;color:#fff;font-size:14px;outline:none}
  .chat-input input::placeholder{color:#5e6b83}
  .chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:#388afe;color:#fff;font-size:18px;cursor:pointer}
  @media(max-width:1000px){.chat-grid{grid-template-columns:1fr}.rev-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="stage">
