</div><!-- /stage -->
</div></div><!-- /scaler /scaleWrap -->
<script>
(function(){
  var stage=document.getElementById('stage'), scaler=document.getElementById('scaler'), wrap=document.getElementById('scaleWrap');

  // чистые карточки кейсов (обложки битые в макете — вставляю нарезанные) + класс для «музыки ветра»
  [['atrea',454],['donau',606],['witzighausen',753],['edelhaus',910],['ewig',1055],['aletia',1210]].forEach(function(c){
    var im=document.createElement('img');im.className='chime-img';im.src='assets/img/cases/'+c[0]+'.png';
    im.style.cssText='position:absolute;left:'+c[1]+'px;top:2773px;width:146px;height:325px;object-fit:cover;border-radius:14px;z-index:5';
    stage.appendChild(im);});

  // ряд логотипов одной картинкой (с домиком WR, aletia) — вместо битых отдельных
  var lg=document.createElement('img'); lg.src='assets/img/cases/logos.png';
  lg.style.cssText='position:absolute;left:88px;top:3168px;width:1272px;height:auto;object-fit:contain;z-index:6';
  stage.appendChild(lg);

  // треугольник play на видео Emotion (кружок ~x903,y1742,d57)
  var pl=document.createElement('div');
  pl.style.cssText='position:absolute;left:924px;top:1760px;width:0;height:0;border-left:14px solid #0f0f0f;border-top:9px solid transparent;border-bottom:9px solid transparent;z-index:7';
  stage.appendChild(pl);

  // сквозные направляющие через весь сайт
  var fullGuides=[122,690,1318].map(function(x){var g=document.createElement('div');g.className='guide-full';g.style.left=x+'px';scaler.appendChild(g);return g;});

  // иконки функций (если чёрные квадраты) — не критично, пропускаем авто

  // липкое меню + крутящийся чёрный логотип
  var bar=document.createElement('div');bar.id='topbar';
  bar.innerHTML='<div class="tb-in"><span class="tb-logo"><img id="tbLogo" src="assets/img/31_628.png" alt=""><b>BUUQ</b></span>'
    +'<nav class="tb-nav"><a>Leistungen</a><a>Projekte</a><a>Über uns</a><a>Prozess</a><a>Kontakt</a></nav>'
    +'<a class="tb-cta" href="#">kostenloses Erstgespräch →</a></div>';
  document.body.appendChild(bar);
  var tbLogo=document.getElementById('tbLogo');
  function onScroll(){var y=window.scrollY;bar.classList.toggle('show',y>240);if(tbLogo)tbLogo.style.transform='rotate('+(y*0.28)+'deg)';}
  window.addEventListener('scroll',onScroll,{passive:true});

  function fit(){var s=Math.min(1,window.innerWidth/1440);scaler.style.transform='scale('+s+')';wrap.style.height=(scaler.offsetHeight*s)+'px';
    fullGuides.forEach(function(g){g.style.height=scaler.offsetHeight+'px';});onScroll();}
  window.addEventListener('resize',fit);fit();setTimeout(fit,700);

  // заголовки: подсветка букв под курсором (для крупного текста)
  var heads=[].filter.call(document.querySelectorAll('#stage .t'),function(t){return parseFloat(t.style.fontSize)>=40;});
  function wrapChars(el){
    [].slice.call(el.childNodes).forEach(function(node){
      if(node.nodeType===3){ var frag=document.createDocumentFragment();
        node.textContent.split('').forEach(function(c){var s=document.createElement('span');s.className='ch';s.textContent=c;s.style.transition='color .18s';frag.appendChild(s);});
        el.replaceChild(frag,node);
      } else if(node.nodeType===1){ wrapChars(node); }
    });
  }
  heads.forEach(function(h){ wrapChars(h);
    var chars=h.querySelectorAll('.ch');
    h.addEventListener('mousemove',function(e){chars.forEach(function(ch){var r=ch.getBoundingClientRect();var dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);ch.style.color=Math.sqrt(dx*dx+dy*dy)<52?'#388afe':'';});});
    h.addEventListener('mouseleave',function(){chars.forEach(function(c){c.style.color='';});});
  });

  // герой-скриншот НЕ двигается (по просьбе) — движение убрано

  // блок «Wie Sie auftreten» — 3D-наклон картинок при наведении
  var tilts=[].slice.call(document.querySelectorAll('.tilt-img'));var mouse={x:-9999,y:-9999};
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  tilts.forEach(function(el,i){el._ph=i*1.3;el._h=false;
    el.addEventListener('mouseenter',function(){el._h=true;el.style.transition='none';});
    el.addEventListener('mouseleave',function(){el._h=false;el.style.transition='transform .55s ease';el.style.transform='';});});
  function tframe(t){var ti=t/1000;tilts.forEach(function(el){if(!el._h)return;var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var rx=Math.cos(ti*0.9+el._ph)*2.4-(mouse.y-cy)/r.height*12,ry=Math.sin(ti*1.1+el._ph)*2.4+(mouse.x-cx)/r.width*12;
    el.style.transform='perspective(800px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';});requestAnimationFrame(tframe);}
  requestAnimationFrame(tframe);

  // кейсы — «музыка ветра» + звук
  var chimes=[].slice.call(document.querySelectorAll('.chime-img'));var actx=null;
  function chime(f){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    var t0=actx.currentTime,o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.05,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+1.4);
    o.connect(g);o2.connect(g);g.connect(actx.destination);o.start(t0);o2.start(t0);o.stop(t0+1.4);o2.stop(t0+1.4);}catch(e){}}
  var PENT=[523.25,587.33,659.25,783.99,880,1046.5];
  chimes.forEach(function(c,i){c._ph=i*0.9;c._tl=0;c._v=0;c._tg=0;
    c.addEventListener('mouseenter',function(){chime(PENT[i%PENT.length]);});
    c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();c._tg=((e.clientX-r.left)/r.width-0.5)*11;});
    c.addEventListener('pointerleave',function(){c._tg=0;});});
  function cframe(t){var ti=t/1000;chimes.forEach(function(c){c._v+=(c._tg-c._tl)*0.10;c._v*=0.84;c._tl+=c._v;
    var idle=Math.sin(ti*1.3+c._ph)*0.7;c.style.transform='rotate('+(c._tl+idle).toFixed(2)+'deg)';});requestAnimationFrame(cframe);}
  requestAnimationFrame(cframe);

  // текст-ссылки (без плашки): стрелка сразу после текста
  [].forEach.call(document.querySelectorAll('#stage .t'),function(t){
    if(/^(Unsere Projekte sehen|Projekt besprechen)/.test((t.textContent||'').trim())){
      if(t.textContent.indexOf('→')<0){t.textContent=t.textContent.replace(/\s+$/,'')+'  →';t.style.whiteSpace='nowrap';t.style.width='auto';}
    }});
  // pill-кнопки: стрелка у ПРАВОГО края + подсветка (п.4)
  [].forEach.call(document.querySelectorAll('#stage div'),function(d){
    var bg=(d.style.background||''),h=parseFloat(d.style.height)||0,rad=parseFloat(d.style.borderRadius)||0,w=parseFloat(d.style.width)||0;
    if(bg && h>=36 && h<=46 && rad>=18 && w>=120 && !d.querySelector('*')){
      var dark=/\((0|8|15|3),/.test(bg.replace(/\s/g,''));
      var ar=document.createElement('div'); ar.textContent='→';
      ar.style.cssText='position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:15px;color:'+(dark?'#fff':'#0f0f0f')+';pointer-events:none';
      d.appendChild(ar);
      if(dark){d.style.cursor='pointer';d.style.transition='box-shadow .2s,transform .18s';
        d.addEventListener('mouseenter',function(){d.style.boxShadow='0 8px 22px rgba(56,138,254,.5),0 0 0 1px rgba(56,138,254,.7) inset';d.style.transform='translateY(-1px)';});
        d.addEventListener('mouseleave',function(){d.style.boxShadow='';d.style.transform='';});}
    }});
  // отзывы: нав-стрелки слева/справа (п.6)
  [[442,'←'],[1323,'→']].forEach(function(a){var b=document.createElement('div');
    b.style.cssText='position:absolute;left:'+a[0]+'px;top:5987px;width:45px;height:45px;border-radius:50%;background:#fff;border:1px solid #e2e2e2;display:flex;align-items:center;justify-content:center;font-size:17px;color:#0f0f0f;z-index:9;box-shadow:0 4px 12px rgba(0,0,0,.06);cursor:pointer';
    b.textContent=a[1]; stage.appendChild(b);});
})();
</script>
</body>
</html>
